spring:
  application:
    name: tw-notification
  config:
    # Running from the IDE / plain `java -jar`: read the same .env Docker uses (KEY=VALUE is valid .properties).
    # Real environment variables (Docker) still take precedence over values from this file.
    import: optional:file:./.env[.properties]
  datasource:
    # Local run defaults point at the Docker Postgres published on POSTGRES_HOST_PORT (6033); Docker overrides via SPRING_DATASOURCE_*.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:6033}/${POSTGRES_DB:tw_notification}}
    username: ${SPRING_DATASOURCE_USERNAME:${APP_DB_USER:${POSTGRES_USER:tw}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${APP_DB_PASSWORD:${POSTGRES_PASSWORD:tw_notification_change_me}}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    static-path-pattern: /technician/images/**
    dispatch-options-request: true
    dispatch-trace-request: true
  web:
    resources:
      # Serve uploaded files from the same directory FileUtils writes into at runtime.
      static-locations: classpath:/static/,file:./src/main/resources/static/
      add-mappings: true
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8089
  address: 0.0.0.0
  # Support reverse proxy headers from IIS / nginx
  forward-headers-strategy: framework
  error:
    include-message: always
  tomcat:
    accept-count: 100

springdoc:
  api-docs:
    path: /technician/v3/api-docs
  swagger-ui:
    enabled: true
    path: /technician/index.html
    doc-expansion: none
    # Open on the group external systems need (POST /api/v1/ingest/alerts); other groups via "Select a definition".
    urls-primary-name: "1 - ingest (S3 → us)"
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  timezone: ${APP_TIMEZONE:Asia/Karachi}
  security:
    # false = no API key / no JWT anywhere (ingest open, app identifies with X-User-Phone, dashboard open).
    # Set AUTH_ENABLED=true before exposing the server publicly.
    enabled: ${AUTH_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:ChangeMe123!}
  ingest:
    initial-api-key: ${INGEST_INITIAL_API_KEY:}
  dispatch:
    batch-size: 500
    redispatch-fixed-delay-ms: 30000
  rate-limit:
    requests-per-minute: 20

auth:
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-random-string-of-at-least-32-chars}
    access-ttl: 15m
    refresh-ttl: 30d

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:./config/firebase-service-account.json}

logging:
  file:
    name: ${LOGGING_FILE_NAME:app.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    com.trackingworld.tw: INFO
