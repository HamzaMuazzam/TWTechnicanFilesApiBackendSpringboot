spring.application.name=TWLiveBackendSpringboot


#spring.datasource.url=jdbc:postgresql://localhost:5432/tw_technician
#spring.datasource.username=postgres
#spring.datasource.password=twgis123
server.port=8088
server.address=0.0.0.0
# Set one as primary for autoconfiguration to avoid conflicts
server.servlet.context-path=/technician

# Support reverse proxy headers from IIS
server.forward-headers-strategy=framework

# Swagger config (aligned with reverse proxy)
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/index.html
springdoc.swagger-ui.url=/technician/v3/api-docs
springdoc.swagger-ui.config-url=/technician/v3/api-docs/swagger-config
springdoc.swagger-ui.doc-expansion=none

#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=none
#Options: update, create, validate, `none, create-drop


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
spring.jpa.open-in-view=true

# Enable serving of static resources
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.mvc.static-path-pattern=/images/**
# Serve uploaded files from the same directory FileUtils writes into at runtime.
spring.web.resources.static-locations=classpath:/static/,file:./src/main/resources/static/
spring.web.resources.add-mappings=true
spring.mvc.dispatch-options-request=true
spring.mvc.dispatch-trace-request=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

logging.file.name=app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
server.tomcat.accept-count=100
logging.level.com.zaxxer.hikari=DEBUG
